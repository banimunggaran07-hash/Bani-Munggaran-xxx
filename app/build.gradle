plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.bani.calculatorotr"
    compileSdk 34

    defaultConfig {
        applicationId "com.bani.calculatorotr"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.3.0"
        // Aplikasi web dibundel offline di assets/www
        buildConfigField "String", "START_URL", "\"https://appassets.androidplatform.net/assets/www/index.html\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.webkit:webkit:1.10.0"
}
